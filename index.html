    <style>
      html, body { margin: 0; height: 100%; background: #f7f6f3; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']), html:not([data-theme='light']) body { background: #141317; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot svg { width: 56px; height: 56px; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { to { opacity: 0.4; } }
    </style>

    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#1A1820"/><path d="M45 21C39 13.5 22 13 17.5 27C13 41 26 53 41 47" stroke="#16C75B" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div id="root"></div>
    <noscript>
      <h1>Curvesmith</h1>
      <p>Curvesmith is a professional vector editor that runs in your browser: pen and node tools, live boolean shapes, gradients, Google Fonts, and SVG, PDF, AI, EPS, DXF, EMF and PNG export. It needs JavaScript to run.</p>
